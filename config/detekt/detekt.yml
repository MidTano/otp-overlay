# Detekt configuration for :app.
#
# Mode: BUILD UPON DEFAULTS (`buildUponDefaultConfig = true` in
# app/build.gradle.kts). The defaults catch most real bugs; this file
# only flips knobs where the default doesn't match the project's
# constraints (Android-specific platform code, deeply animated
# overlay layouts, large but cohesive view classes).
#
# Severity policy:
#   • style / formatting issues → warning  (baseline absorbs them)
#   • potential-bug rules       → error    (fail the build)

build:
  maxIssues: 0
  excludeCorrectable: false
  weights:
    complexity: 2
    LongParameterList: 1
    style: 1
    comments: 1

config:
  validation: true
  warningsAsErrors: false
  excludes: ''

processors:
  active: true

console-reports:
  active: true
  exclude:
    - 'ProjectStatisticsReport'
    - 'ComplexityReport'
    - 'NotificationReport'
    - 'FindingsReport'
    - 'FileBasedFindingsReport'

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    threshold: 30
  ComplexCondition:
    # Animation gate conditions in the renderer routinely chain
    # 4..5 boolean knobs (`perimEn && !ultra && !compact && w > eps`).
    # Splitting them into named locals adds no clarity and bloats
    # the per-frame call site.
    threshold: 6
  LongMethod:
    active: true
    # Overlay rendering and Settings binders are inherently long
    # because they wire many controls in one place. 240 covers the
    # FX tuner / descriptions binder; the rest stay well below.
    threshold: 240
  LongParameterList:
    active: true
    # Renderer functions in the overlay package routinely take
    # 10..13 typed parameters (Canvas + paints + geometry +
    # animation channels). Wrapping them all in data classes adds
    # allocation noise on the hot draw loop and zero clarity. The
    # only suppression needed elsewhere is the fully-typed builder
    # constructor in the queue controller.
    functionThreshold: 14
    constructorThreshold: 14
  LargeClass:
    active: true
    threshold: 1500
  TooManyFunctions:
    active: true
    # Prefs.kt is a forwarding facade with one method per stored
    # field; PrefsFx alone has 70+ FX knobs. Splitting them by
    # category is already done at the package level. The 200 cap
    # here keeps a real god-class trap intact while letting the
    # facades pass.
    thresholdInClasses: 200
    thresholdInObjects: 200
    thresholdInInterfaces: 25
    thresholdInEnums: 25
    ignorePrivate: true
    ignoreOverridden: true
  NestedBlockDepth:
    active: true
    threshold: 7
  NestedScopeFunctions:
    active: false

empty-blocks:
  active: true
  EmptyCatchBlock:
    # Empty catches with `_:` are routine in this codebase
    # (animator.cancel mid-teardown, notification mirror best-effort).
    # We rely on KDoc / inline comments for justification, so the
    # rule is downgraded to allow them.
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected).*'
  EmptyFunctionBlock:
    # TextWatcher.beforeTextChanged / afterTextChanged are overrides
    # we genuinely never use; suppress for overrides and let the
    # rest fire.
    active: true
    ignoreOverridden: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    # Notification-listener / accessibility paths intentionally
    # catch `Exception` so a malformed IPC bundle from a third-party
    # app cannot disable the service. The rule is muted; sweep is
    # done separately.
    active: false
  TooGenericExceptionThrown:
    active: true
  SwallowedException:
    active: false
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
  InstanceOfCheckForException:
    active: true

naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '[a-z][A-Za-z0-9]*'
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Z0-9]*'
    propertyPattern: '[A-Za-z][A-Za-z0-9]*'
  VariableNaming:
    active: true
    variablePattern: '[a-z][A-Za-z0-9]*'

performance:
  active: true
  SpreadOperator:
    active: false
  ArrayPrimitive:
    active: true
  ForEachOnRange:
    active: true

potential-bugs:
  active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  ExitOutsideMain:
    active: true
  ImplicitDefaultLocale:
    active: true
  IteratorHasNextCallsNextMethod:
    active: true
  IteratorNotThrowingNoSuchElementException:
    active: true
  UnreachableCode:
    active: true
  UnsafeCast:
    active: true
  UnsafeCallOnNullableType:
    active: true
  WrongEqualsTypeParameter:
    active: true

style:
  active: true
  LoopWithTooManyJumpStatements:
    # The OTP extractor and accessibility tree walker iterate with
    # multiple early-out paths on purpose; collapsing them into a
    # single break would obscure the order of preconditions.
    active: false
  MagicNumber:
    # Animation timings, paint sizes, FX knob defaults — magic
    # numbers are pervasive and intentional in the overlay layer.
    # Disabled here; const-extraction is done as a separate pass.
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: true
  ReturnCount:
    active: true
    max: 8
    excludedFunctions:
      - equals
      - 'extract'
      - 'handlePosted'
      - 'tryPasteInTree'
  WildcardImport:
    active: true
    excludeImports:
      - java.util.*
      - kotlinx.android.synthetic.*
  UnnecessaryAbstractClass:
    active: false
  UseDataClass:
    active: false
  ForbiddenComment:
    active: true
    comments:
      - reason: 'FIXME tags should be resolved before merging'
        value: 'FIXME:'
      - reason: 'STOPSHIP tags must never make it past review'
        value: 'STOPSHIP:'
  NewLineAtEndOfFile:
    active: true
  OptionalAbstractKeyword:
    active: true
  OptionalUnit:
    active: true
  ProtectedMemberInFinalClass:
    active: true
  RedundantVisibilityModifierRule:
    active: false
  SafeCast:
    active: true
  SerialVersionUIDInSerializableClass:
    active: true
  ThrowsCount:
    active: true
    max: 4
  TrailingWhitespace:
    active: true
  UnusedImports:
    active: true
  UnusedPrivateMember:
    active: true
  UseCheckOrError:
    active: true
  UseRequire:
    active: true
  UtilityClassWithPublicConstructor:
    active: true

formatting:
  active: true
  android: true
  autoCorrect: true
  # Multi-line wrapping rules that detekt 1.23.x cannot auto-fix
  # (they require positional reformatting that the ktlint integration
  # does not perform for us). Disabled here so PRs do not need to
  # chase 600+ "argument should be on separate line" findings;
  # `editorconfig` + IDE auto-format keeps the code consistent.
  ArgumentListWrapping:
    active: false
  ParameterListWrapping:
    active: false
  Wrapping:
    active: false
  ChainWrapping:
    active: false
  MultiLineIfElse:
    active: false
  AnnotationOnSeparateLine:
    active: false
  CommentWrapping:
    active: false
  CommentSpacing:
    active: true
  Indentation:
    active: false
  MaximumLineLength:
    active: true
    maxLineLength: 120
  ImportOrdering:
    active: true
  NoWildcardImports:
    active: true
  NoUnusedImports:
    active: true
  NoTrailingSpaces:
    active: true
  NoMultipleEmptyLines:
    active: true
  NoMultipleSpaces:
    active: true
  TrailingCommaOnCallSite:
    active: true
    useTrailingCommaOnCallSite: true
  TrailingCommaOnDeclarationSite:
    active: true
    useTrailingCommaOnDeclarationSite: true
  SpacingBetweenDeclarationsWithAnnotations:
    active: true
