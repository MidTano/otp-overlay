name: Android Release

# Manual + tag-driven release pipeline. Lints and builds a signed
# release APK if signing material is present in repo secrets. On tag
# pushes (`v*`) the signed APK and the R8 mapping file are also
# attached to the corresponding GitHub Release.
#
# All third-party actions are pinned to a full commit SHA with the
# matching tag in the trailing comment — see android.yml for the
# rationale and the regen command.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Lint and signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Pin SOURCE_DATE_EPOCH to the tag commit so app/build.gradle.kts
      # produces a reproducible BUILD_TIME for tag-driven releases.
      SOURCE_DATE_EPOCH: ''

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Pin SOURCE_DATE_EPOCH to commit timestamp
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-disabled: false

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Lint (release)
        run: ./gradlew :app:lintRelease --stacktrace

      # If RELEASE_KEYSTORE_BASE64 is set, decode it into release.jks
      # and pass the keystore path / passwords through to Gradle via
      # env variables that app/build.gradle.kts already reads.
      #
      # If the secret is missing the release build still runs but the
      # Gradle config falls back to the debug signing key, producing a
      # debug-signed APK. That's intentional so contributors can dry-run
      # this workflow on forks where they don't have the production key.
      #
      # The decode step itself ALWAYS runs (we can't gate it on the
      # secret because GitHub Actions disallows `secrets.*` inside
      # `if:` expressions). Instead the `run` block tests the env var
      # internally and exports `RELEASE_KEYSTORE_PATH` only when the
      # secret is non-empty — Gradle then sees the path and signs,
      # otherwise it falls back to the debug keystore.
      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is empty — falling back to debug signing."
            exit 0
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.jks" >> "$GITHUB_ENV"

      - name: Assemble release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ env.RELEASE_KEYSTORE_PATH }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Wipe decoded keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.jks"

      - name: Upload release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      # Tag-driven release publishing. Creates a draft GitHub Release
      # named after the tag, attaches the signed APK and the R8 mapping
      # file. The "draft" status lets the project owner double-check
      # the release notes before the tag becomes public.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          draft: true
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
