android.useAndroidX=true
# All dependencies in this project are AndroidX-native — Jetifier just
# slows the build down. Re-enable only if a non-AndroidX dependency is
# reintroduced.
android.enableJetifier=false

# AGP non-transitive R classes — smaller R.java per module, faster build.
android.nonTransitiveRClass=true

# ── Build performance ────────────────────────────────────────────────
# 6 GB heap covers AGP 9 + Kotlin 2.2 + R8 with comfortable headroom on
# medium-sized incremental builds. Modern JVM (G1) keeps GC pauses low
# at this size; raise to -Xmx8g only if you see OOM during R8.
org.gradle.jvmargs=-Xmx6g -Xms1g -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxMetaspaceSize=1g

# Daemon must be ON for incremental builds — every cold daemon start
# costs ~30 s for AGP plugin init alone.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache reuses the configured task graph between
# invocations — first run still configures the project, subsequent
# runs skip the configuration phase entirely (~3-8 s savings per
# build). Turn off if a plugin is incompatible.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
# Skip configuring projects that the requested task graph does not
# touch. Single-module project here, but harmless and forwards-
# compatible with future split-up.
org.gradle.configureondemand=true
# Watch the filesystem for changes between builds so unchanged inputs
# do not have to be rehashed each time.
org.gradle.vfs.watch=true

# Pin Gradle to JDK 21 (Eclipse Temurin LTS). AGP 9.2 expects JDK 17+;
# JDK 21 is the recommended runtime as of mid-2026. The Gradle daemon
# auto-provisions a matching toolchain through the foojay resolver when
# JAVA_HOME is unset, so we deliberately avoid hard-coding a Windows
# path here — that would break CI and any non-Windows contributor.
