# Robolectric 4.14.x supports up to API 35 (Android 15). The
# project's `targetSdk` is 36, but Robolectric reads its SDK images
# from `Robolectric Maven artefacts` rather than the platform-tools
# install — so tests run against API 35 in the offscreen sandbox
# regardless of the host SDK config. Setting `sdk` here pins every
# Robolectric @RunWith(AndroidJUnit4) class without each one having
# to declare `@Config(sdk = 35)` individually.
#
# When Robolectric ships an API-36 image, bump this value to match
# `targetSdk`. Until then the API-35 sandbox covers every code path
# the app uses (notification channels, clipboard sensitive flag,
# foreground-service types, accessibility nodes).
sdk=35
